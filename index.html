<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Генератор графики курса</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
:root{--paper:#F2F5EC;--ink:#202020;--line:rgba(32,32,32,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--paper);color:var(--ink);font:13px/1.4 Manrope,system-ui,Arial,sans-serif}
aside{height:100%;overflow-y:auto;padding:18px;border-right:1px solid var(--line)}
h1{font-size:15px;margin:0 0 12px}
h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7a7f82;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer;transition:background .2s,color .2s}
button:hover{background:rgba(32,32,32,.07)}
button.on,button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{margin:8px 0}.row label{display:flex;justify-content:space-between;font-size:11px;color:#555}
.row b{font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.cols label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#555}
input[type=color]{width:32px;height:20px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:12px}
main{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px}
#stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
 background:repeating-conic-gradient(#e9ece3 0 25%,#f6f8f1 0 50%) 0 0/16px 16px}
#stage svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}
.ctl{display:flex;align-items:center;gap:10px}
.ctl .sl{flex:1;min-width:0}
.ticks{display:flex;justify-content:space-between;padding:0 2px;margin-top:2px}
.ticks button{padding:2px 9px;font-size:11px;border-color:transparent}
.lab{font-size:11px;color:#555;white-space:nowrap}.lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.sq{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:13px}
.fxh{font-weight:700;margin:10px 0 2px}
.fxp{margin:0 0 8px 24px;padding:2px 0 4px 10px;border-left:2px solid var(--line)}
.fxp[hidden]{display:none}
.hint{font-size:10.5px;color:#7a7f82;margin:0 0 4px}
.fxp .seg{margin:6px 0}
.fxp button{padding:4px 10px}
.fxp .cols{margin:6px 0}
select{width:100%;font:inherit;font-size:11px;color:var(--ink);background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.gif-field{margin:8px 0}.gif-field>label{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#555;margin-bottom:3px}.gif-field b{color:var(--ink);font-variant-numeric:tabular-nums}.gif-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gif-status{font-size:10.5px;color:#7a7f82;min-height:14px;margin:7px 0 2px;overflow-wrap:anywhere}.gif-progress{height:3px;background:rgba(32,32,32,.10);border-radius:99px;overflow:hidden;margin-top:6px}.gif-progress>div{height:100%;width:0;background:var(--ink);transition:width .12s}
.control-section{border-top:1px solid var(--line);margin-top:16px}
.control-section>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;padding:12px 2px 8px 0;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7a7f82}
.control-section>summary::-webkit-details-marker{display:none}
.control-section>summary::after{content:'+';font-size:17px;font-weight:400;letter-spacing:0;line-height:1;color:var(--ink);width:18px;text-align:center}
.control-section[open]>summary::after{content:'−'}
.control-section>summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}
.control-section[open]>summary{padding-bottom:8px}
.control-section #fx,.control-section #gifControls{padding-bottom:4px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:64dvh minmax(0,1fr)}main{order:-1;padding:10px}aside{border:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>Генератор графики курса</h1>
  <div class="seg" id="views"></div>
  <h2>Размеры и пропорции</h2>
  <div id="sliders"></div>
  <h2>Цвета</h2>
  <div class="cols" id="colors"></div>
  <h2>Цвета уровней пирамиды</h2>
  <div class="cols" id="levels"></div>
  <h2>Опции</h2>
  <div id="checks"></div>
  <details class="control-section" id="effectsSection">
    <summary>Эффекты</summary>
    <div id="fx"></div>
  </details>
  <details class="control-section" id="gifSection">
    <summary>GIF-анимация</summary>
    <div id="gifControls"></div>
    <button class="pri" id="exGif" style="width:100%;margin-top:5px">Скачать GIF</button>
    <div class="gif-progress" aria-hidden="true"><div id="gifProgress"></div></div>
    <div class="gif-status" id="gifStatus" role="status" aria-live="polite">GIF сохранит текущие фигуры, цвета и эффекты.</div>
  </details>
  <h2>Экспорт</h2>
  <div class="seg">
    <button class="pri" id="exSvg">Скачать SVG</button>
    <button id="exCopy">Копировать SVG</button>
    <button class="pri" id="exPng">Скачать PNG ×2</button>
    <button class="pri" id="exPptx">PPTX (кадр)</button>
    <button id="exPptxAll">PPTX (6 этапов)</button>
  </div>
</aside>
<main>
  <div id="stage"></div>
  <div class="ctl">
    <button class="sq" id="prev" title="Назад (←)">‹</button>
    <button class="sq" id="play" title="Автопоказ">▶</button>
    <button class="sq" id="next" title="Вперёд (→)">›</button>
    <div class="sl">
      <input type="range" id="st" min="1" max="6" step="0.01" value="6" aria-label="Уровень сборки">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="lab">Собрано <b id="stLab"></b></div>
  </div>
</main>

<script>
/* Размеры в «залах» (сторона ядра = 1). Пропорции из 3D-модели: шаг 0.5, толщина витка 0.1.
   Экспорт: 1 зал = 160 px (как ядро в Figma). */
const N = 6, U = 160;
const FX0 = () => ({
  rad: 0,
  noise: false, nAmt: 12, nSize: 1, nMode: 'overlay',
  glass: false, gA: 35, gBlur: 40, gLine: true,
  clay: false, cInt: 60, cSz: 14, cDrop: 50, cCol: '#3B3350',
  aurora: false, aBlur: 160, aSeed: 1, ac: ['#62B0DA', '#F8F4C0', '#B79CE0', '#8EE3C8'],
  hard: false, hOff: 8, hCol: '#000000', hLine: true,
  chrome: false, chMode: 'palette', chDens: 1.5, chAng: 35,
  gradient: false, gradMode: 'linear', gradC1: '#FFFFFF', gradC2: '#62B0DA', gradAng: 35,
  blur: false, blurAmt: 5
});
const o = {
  view: 'plan', stage: 6,
  t: .1, dot: .2, h: .5, g: 6, m: .5,
  bg: '#F2F5EC', ghost: '#B9BDBF', dotc: '#F8F4C0', frm: '#7C7085', sp: '#62B0DA',
  lv: ['#FFFFFF', '#F8F4C0', '#D5DAC8', '#7C7085', '#62B0DA', '#B9BDBF'],
  frame: true, gS: true, gP: false, tr: false,
  fx: FX0()
};
const VIEWS = [['plan', 'Пирамида сверху'], ['facade', 'Пирамида, фасад'], ['spiral', 'Спираль']];
const SL = [['t', 'Толщина витка (спираль)', .04, .25, .01], ['dot', 'Диаметр круга', .1, .4, .01],
  ['h', 'Высота яруса (фасад)', .25, 1, .01], ['g', 'Этажность (фасад)', 1, 6, 1], ['m', 'Поля пунктирной рамки', 0, 1.5, .05]];
const CL = [['bg', 'Фон'], ['sp', 'Спираль'], ['dotc', 'Круг'], ['frm', 'Рамка'], ['ghost', 'Контур будущих']];
const CK = [['frame', 'Пунктирная рамка роста'], ['gS', 'Контур будущих витков (спираль)'],
  ['gP', 'Контур будущих уровней (вид сверху)'], ['tr', 'Прозрачный фон']];

const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const cl = x => Math.min(1, Math.max(0, x));

/* p — дробный уровень сборки (для анимации); целое p = готовый этап */
function build(o, p) {
  const P = [], L = o.lv, r = o.dot / 2;
  const k0 = Math.min(N, Math.floor(p)), fr = k0 >= N ? 0 : p - k0, k1 = Math.min(N, k0 + 1);
  const rect = (x, y, w, h, c, a = 1, gh = 0) => { if (c && a > 0) P.push({ k: 'r', x, y, w, h, c, a, gh }); };
  const part = (i, f) => i <= k0 ? 1 : i === k0 + 1 ? f : 0;      // доля появления уровня i
  let ext;
  if (o.view === 'plan') {
    for (let i = N; i >= 1; i--) {
      const a = i === 1 ? 1 : part(i, ease(fr));
      if (o.gP && a < 1) rect(-i / 2, -i / 2, i, i, o.ghost, 1, 1);
      const s = i === 1 ? 1 : (i - 1) + a;
      rect(-s / 2, -s / 2, s, s, L[i - 1], a);
    }
    P.push({ k: 'e', cx: 0, cy: 0, r, c: o.dotc });
    ext = [-N / 2, -N / 2, N / 2, N / 2];
  } else if (o.view === 'facade') {
    // пирамида стоит на земле: уровень i на этапе k лежит на «этаже» (k−i)
    const e = (i, k) => Math.max(0, Math.floor((k - i) * o.g / N));
    const lift = ease(cl(fr / .6)), app = ease(cl((fr - .35) / .65));
    const elev = i => i > k0 ? 0 : e(i, k0) + (e(i, k1) - e(i, k0)) * lift;
    for (let i = N; i >= 1; i--) {
      const a = i === 1 ? 1 : part(i, app);
      const w = i === 1 ? 1 : (i - 1) + a;
      rect(-w / 2, -(elev(i) + 1) * o.h, w, o.h, L[i - 1], a);
    }
    P.push({ k: 'e', cx: 0, cy: -(elev(1) + 1) * o.h - r, r, c: o.dotc });
    ext = [-N / 2, -(e(1, N) + 1) * o.h - o.dot, N / 2, 0];
  } else {
    rect(-.5, -.5, 1, 1, L[0]);
    let s = [0, -.5];
    const t = o.t, h2 = t / 2;
    const leg = (a, b, last, d) => {              // d — сколько длины ноги нарисовать
      const len = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
      const sx = Math.sign(b[0] - a[0]), sy = Math.sign(b[1] - a[1]);
      const e0 = a.first ? 0 : h2, e1 = last ? 0 : h2;
      const x0 = a[0] - sx * e0, y0 = a[1] - sy * e0, x1 = a[0] + sx * d + sx * (d >= len ? e1 : 0), y1 = a[1] + sy * d + sy * (d >= len ? e1 : 0);
      if (sx === 0) rect(a[0] - h2, Math.min(y0, y1), t, Math.abs(y1 - y0), o.cur, 1, o.curG);
      else rect(Math.min(x0, x1), a[1] - h2, Math.abs(x1 - x0), t, o.cur, 1, o.curG);
    };
    for (let k = 0; k < N - 1; k++) {
      const out = .5 + (k + 1) * .5, inn = .5 + k * .5;
      const pts = k ? [[-inn, -out], [out, -out], [out, out], [-out, out]] : [[0, -out], [out, -out], [out, out], [-out, out]];
      const path = [s, ...pts]; s = pts[3];
      const a = part(k + 2, ease(fr)), total = 4 * (2 * out) - (k ? 0 : out - .5) - (k ? 0 : 0);
      const lens = path.slice(1).map((b, j) => Math.abs(b[0] - path[j][0]) + Math.abs(b[1] - path[j][1]));
      const sum = lens.reduce((x, y) => x + y, 0);
      const draw = (frac, color, gh) => {
        let rem = frac * sum; o.cur = color; o.curG = gh;
        for (let j = 0; j < 4 && rem > 1e-9; j++) {
          const A = [...path[j]]; A.first = !k && !j;
          leg(A, path[j + 1], k === N - 2 && j === 3, Math.min(lens[j], rem)); rem -= lens[j];
        }
      };
      if (o.gS && a < 1) draw(1, o.ghost, 1);
      if (a > 0) draw(a, o.sp);
    }
    P.push({ k: 'e', cx: 0, cy: 0, r, c: o.dotc });
    ext = [-N / 2 - o.t / 2, -N / 2 - o.t / 2, N / 2 + o.t / 2, N / 2 + o.t / 2];
  }
  const m = o.frame ? o.m : 0, pad = .1;
  const x0 = ext[0] - m, y0 = ext[1] - m, x1 = ext[2] + m, y1 = ext[3] + m;
  if (o.frame) P.push({ k: 'f', x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
  return { P, bb: { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad } };
}

const f = n => +(n * U).toFixed(2);
const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (c, t) => { const w = t > 0 ? 255 : 0, a = Math.abs(t);   // t>0 — к белому, t<0 — к чёрному
  return '#' + hx(c).map(v => Math.round(v + (w - v) * a).toString(16).padStart(2, '0')).join(''); };
const rng = seed => () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
const CHR_L = [[0, -.55], [.12, .62], [.28, -.38], [.44, .3], [.5, -.72], [.56, .55], [.74, -.3], [.9, .66], [1, -.5]];
const CHR_C = [[0, .85], [.2, .3], [.48, -.5], [.62, -.75], [.82, .15], [1, -.2]];

function toSVG(sc, o) {
  const b = sc.bb, X = o.fx, defs = [], grads = new Set();
  const px = n => +n.toFixed(2);
  const bx = f(b.x), by = f(b.y), bw = f(b.w), bh = f(b.h), R0 = Math.max(bw, bh);
  let uid = 0;

  const geo = (q, at, dx = 0, dy = 0) => {
    if (q.k === 'e') return `<circle cx="${px(f(q.cx) + dx)}" cy="${px(f(q.cy) + dy)}" r="${f(q.r)}" ${at}/>`;
    const w = f(q.w), h = f(q.h), r = Math.min(X.rad, w / 2, h / 2);
    return `<rect x="${px(f(q.x) + dx)}" y="${px(f(q.y) + dy)}" width="${w}" height="${h}"${r > 0 ? ` rx="${px(r)}"` : ''} ${at}/>`;
  };
  const box = q => q.k === 'e' ? [f(q.cx - q.r), f(q.cy - q.r), f(2 * q.r), f(2 * q.r)] : [f(q.x), f(q.y), f(q.w), f(q.h)];

  /* Пользовательский градиент заливки. Можно сочетать со скруглением, стеклом и тенями. */
  const fillOf = q => {
    if (X.gradient) {
      const id = 'user-gradient';
      if (!grads.has(id)) {
        grads.add(id);
        if (X.gradMode === 'radial') {
          defs.push(`<radialGradient id="${id}" cx="32%" cy="28%" r="88%"><stop offset="0%" stop-color="${X.gradC1}"/><stop offset="100%" stop-color="${X.gradC2}"/></radialGradient>`);
        } else {
          const a = X.gradAng * Math.PI / 180, dx = Math.cos(a) * 50, dy = Math.sin(a) * 50;
          defs.push(`<linearGradient id="${id}" x1="${px(50-dx)}%" y1="${px(50-dy)}%" x2="${px(50+dx)}%" y2="${px(50+dy)}%"><stop offset="0%" stop-color="${X.gradC1}"/><stop offset="100%" stop-color="${X.gradC2}"/></linearGradient>`);
        }
      }
      return `url(#${id})`;
    }
    if (!X.chrome) return q.c;
    const base = X.chMode === 'silver' ? '#C3C9D2' : X.chMode === 'gold' ? '#E2B04A' : q.c, circ = q.k === 'e';
    const id = (circ ? 'cr' : 'cl') + base.slice(1);
    if (!grads.has(id)) {
      grads.add(id);
      if (circ) defs.push(`<radialGradient id="${id}" cx=".38" cy=".3" r=".8">${CHR_C.map(([t, m]) => `<stop offset="${t}" stop-color="${mix(base, m)}"/>`).join('')}</radialGradient>`);
      else {
        const a = X.chAng * Math.PI / 180, len = R0 * 1.25 / X.chDens, ph = (grads.size - 1) * len * .11, cx = bx + bw / 2 + Math.cos(a) * ph, cy = by + bh / 2 + Math.sin(a) * ph, dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
        defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${px(cx - dx)}" y1="${px(cy - dy)}" x2="${px(cx + dx)}" y2="${px(cy + dy)}" spreadMethod="reflect">${CHR_L.map(([t, m]) => `<stop offset="${t}" stop-color="${mix(base, m)}"/>`).join('')}</linearGradient>`);
      }
    }
    return `url(#${id})`;
  };

  /* 3. Клэй: внутренний блик сверху-слева + внутренняя тень снизу-справа + мягкая внешняя тень */
  const clayFilter = q => {
    const id = 'cy' + uid++, s = X.cSz, k = X.cInt / 100, kd = X.cDrop / 100, off = s * .6, m = 7 * s + 12, [x, y, w, h] = box(q);
    defs.push(`<filter id="${id}" filterUnits="userSpaceOnUse" x="${px(x - m)}" y="${px(y - m)}" width="${px(w + 2 * m)}" height="${px(h + 2 * m)}" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="${px(s * 1.1)}" result="d1"/><feOffset in="d1" dy="${px(s * 1.1)}" result="d2"/>
<feFlood flood-color="${X.cCol}" flood-opacity="${px(.5 * kd)}"/><feComposite in2="d2" operator="in" result="drop"/>
<feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
<feGaussianBlur in="inv" stdDeviation="${px(s * .8)}" result="ib"/>
<feOffset in="ib" dx="${px(off)}" dy="${px(off)}" result="lo"/><feComposite in="lo" in2="SourceAlpha" operator="in" result="lm"/>
<feFlood flood-color="#fff" flood-opacity="${px(.95 * k)}"/><feComposite in2="lm" operator="in" result="light"/>
<feOffset in="ib" dx="${px(-off)}" dy="${px(-off)}" result="do"/><feComposite in="do" in2="SourceAlpha" operator="in" result="dm"/>
<feFlood flood-color="${X.cCol}" flood-opacity="${px(.6 * k)}"/><feComposite in2="dm" operator="in" result="dark"/>
<feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/><feMergeNode in="light"/><feMergeNode in="dark"/></feMerge></filter>`);
    return id;
  };

  /* 4. Аврора: несколько ярких кругов + Layer Blur на группу (в Figma blur 100–300 ≈ σ = blur/2) */
  if (X.aurora) {
    const rnd = rng(X.aSeed * 7919 + 13);
    const a0 = rnd() * 6.283;                               // пятна расставлены по кругу вокруг центра, чтобы цвет был виден и в полях
    const blobs = Array.from({ length: 6 }, (_, i) => {
      const a = a0 + i * 1.047 + (rnd() - .5) * .9, d = R0 * (.28 + .2 * rnd());
      return `<circle cx="${px(bx + bw / 2 + Math.cos(a) * d)}" cy="${px(by + bh / 2 + Math.sin(a) * d)}" r="${px(R0 * (.2 + .16 * rnd()))}" fill="${X.ac[i % 4]}"/>`;
    }).join('');
    defs.push(`<filter id="af" filterUnits="userSpaceOnUse" x="${px(bx - R0)}" y="${px(by - R0)}" width="${px(bw + 2 * R0)}" height="${px(bh + 2 * R0)}"><feGaussianBlur stdDeviation="${X.aBlur / 2}"/></filter>`);
    defs.push(`<g id="aur" filter="url(#af)">${blobs}</g>`);
    defs.push(`<clipPath id="bbc"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}"/></clipPath>`);
  }
  /* 2. Глассморфизм: «задний план» = фон + аврора, размытый; под каждой фигурой показывается его вырез */
  if (X.glass) {
    defs.push(`<filter id="bdf" filterUnits="userSpaceOnUse" x="${px(bx - R0)}" y="${px(by - R0)}" width="${px(bw + 2 * R0)}" height="${px(bh + 2 * R0)}"><feGaussianBlur stdDeviation="${X.gBlur / 2}"/></filter>`);
    defs.push(`<g id="bdb" filter="url(#bdf)">${o.tr ? '' : `<rect x="${px(bx - R0)}" y="${px(by - R0)}" width="${px(bw + 2 * R0)}" height="${px(bh + 2 * R0)}" fill="${o.bg}"/>`}${X.aurora ? '<use href="#aur"/>' : ''}</g>`);
  }
  /* 1. Шум: fractalNoise → серый → blend (Overlay / Color Burn / Multiply) с заданной непрозрачностью */
  if (X.noise) {
    defs.push(`<filter id="grain" filterUnits="userSpaceOnUse" x="${bx}" y="${by}" width="${bw}" height="${bh}" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="${px(.9 * X.nSize)}" numOctaves="3" seed="7" result="n"/>
<feColorMatrix in="n" type="matrix" values="3 0 0 0 -1  3 0 0 0 -1  3 0 0 0 -1  0 0 0 0 ${X.nAmt / 100}" result="g"/>
<feBlend in="g" in2="SourceGraphic" mode="${X.nMode}" result="bl"/><feComposite in="bl" in2="SourceAlpha" operator="in"/></filter>`);
  }

  const lw = 3, shape = q => q.k === 'r' || q.k === 'e';
  const shadow = q => {                                     // 5. жёсткая тень: копия фигуры со смещением, blur = 0
    if (!X.hard || q.gh || !shape(q)) return '';
    const a = q.a < 1 ? ` fill-opacity="${+q.a.toFixed(3)}"` : '';
    return geo(q, `fill="${X.hCol}"${a}`, X.hOff, X.hOff);
  };
  const outline = q => (X.hard && X.hLine && !q.gh && shape(q))   // для спирали обводка рисуется отдельным проходом без швов
    ? geo(q, `fill="${X.hCol}" stroke="${X.hCol}" stroke-width="${2 * lw}" stroke-linejoin="round"`) : '';
  const frame = q => `<rect x="${f(q.x)}" y="${f(q.y)}" width="${f(q.w)}" height="${f(q.h)}" fill="none" stroke="${o.frm}" stroke-width="1.5" stroke-dasharray="8 6"/>`;
  const face = (q, spiral) => {
    if (q.k === 'f') return frame(q);
    const plain = q.gh, a = q.a < 1 ? q.a : 1, fill = plain ? q.c : fillOf(q);
    const flt = (X.clay && !plain) ? ` filter="url(#${clayFilter(q)})"` : '';
    const st = (X.hard && X.hLine && !plain && !spiral) ? ` stroke="${X.hCol}" stroke-width="${lw}" stroke-linejoin="round"` : '';
    const soften = content => {
      if (!X.blur || plain || X.blurAmt <= 0) return content;
      const id = 'blur-shape-' + uid++, [x, y, w, h] = box(q), pad = X.blurAmt * 4 + 4;
      defs.push(`<filter id="${id}" filterUnits="userSpaceOnUse" x="${px(x-pad)}" y="${px(y-pad)}" width="${px(w+2*pad)}" height="${px(h+2*pad)}"><feGaussianBlur stdDeviation="${px(X.blurAmt)}"/></filter>`);
      return `<g filter="url(#${id})">${content}</g>`;
    };
    if (X.glass && !plain) {
      const cid = 'gc' + uid++;
      defs.push(`<clipPath id="${cid}">${geo(q, '')}</clipPath>`);
      return soften(`<g${a < 1 ? ` opacity="${+a.toFixed(3)}"` : ''}><g clip-path="url(#${cid})"><use href="#bdb"/></g>` +
        geo(q, `fill="${fill}" fill-opacity="${X.gA / 100}"${flt}${st}`) +
        (X.gLine ? `<g clip-path="url(#${cid})">${geo(q, 'fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2"')}</g>` : '') + '</g>');
    }
    return soften(geo(q, `fill="${fill}"${a < 1 ? ` fill-opacity="${+a.toFixed(3)}"` : ''}${flt}${st}`));
  };

  let body = o.tr ? '' : `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${o.bg}"/>`;
  if (X.aurora) body += '<g clip-path="url(#bbc)"><use href="#aur"/></g>';
  if (o.view === 'spiral') {                                // всё в одном слое: тени → обводка → заливки
    body += sc.P.map(shadow).join('') + sc.P.map(outline).join('') + sc.P.map(q => face(q, true)).join('');
  } else {                                                  // слои друг над другом: тень каждого уровня падает на нижний
    sc.P.forEach(q => { body += shadow(q) + face(q, false); });
  }
  if (X.noise) body = `<g filter="url(#grain)">${body}</g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}" height="${bh}" viewBox="${bx} ${by} ${bw} ${bh}"><defs>${defs.join('')}</defs>${body}</svg>`;
}

function toPPTX(all) {
  if (!window.PptxGenJS) return alert('Библиотека PptxGenJS не загрузилась (нужен интернет). Экспортируйте SVG: он вставляется в PowerPoint и конвертируется в фигуры.');
  const p = new PptxGenJS(); p.layout = 'LAYOUT_WIDE';
  const hex = c => c.slice(1).toUpperCase();
  (all ? [1, 2, 3, 4, 5, 6] : [o.stage]).forEach(s => {
    const sc = build(o, s), b = sc.bb;
    const k = Math.min(12.3 / b.w, 6.5 / b.h), ox = (13.333 - b.w * k) / 2, oy = (7.5 - b.h * k) / 2;
    const X = x => ox + (x - b.x) * k, Y = y => oy + (y - b.y) * k;
    const sl = p.addSlide();
    if (!o.tr) sl.background = { color: hex(o.bg) };
    sc.P.forEach(q => {
      if (q.k === 'r') sl.addShape(p.ShapeType.rect, { x: X(q.x), y: Y(q.y), w: q.w * k, h: q.h * k, fill: { color: hex(q.c) }, line: { type: 'none' } });
      else if (q.k === 'e') sl.addShape(p.ShapeType.ellipse, { x: X(q.cx - q.r), y: Y(q.cy - q.r), w: 2 * q.r * k, h: 2 * q.r * k, fill: { color: hex(q.c) }, line: { type: 'none' } });
      else sl.addShape(p.ShapeType.rect, { x: X(q.x), y: Y(q.y), w: q.w * k, h: q.h * k, fill: { color: 'FFFFFF', transparency: 100 }, line: { color: hex(o.frm), width: 1, dashType: 'dash' } });
    });
  });
  p.writeFile({ fileName: `course-${o.view}-${all ? 'all-stages' : 'stage' + o.stage}.pptx` });
}

const $ = id => document.getElementById(id);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function draw() {
  $('stage').innerHTML = toSVG(build(o, cur), o);
  $('stLab').textContent = Math.round(cur) + ' / ' + N;
  $('st').value = cur;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === o.view));
}
function tick(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  const d = o.stage - cur, s = (1.1 + 1.2 * Math.abs(d)) * dt;
  if (Math.abs(d) <= s) { cur = o.stage; raf = null; } else { cur += Math.sign(d) * s; raf = requestAnimationFrame(tick); }
  draw();
}
function go(n) {
  o.stage = Math.min(N, Math.max(1, n));
  if (reduce) { cur = o.stage; draw(); return; }
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
}

function gifFrameStage(i, count, cfg) {
  let t = count <= 1 ? 1 : i / (count - 1);
  if (cfg.mode === 'reverse') t = 1 - t;
  else if (cfg.mode === 'pingpong') t = t <= .5 ? t * 2 : (1 - t) * 2;
  if (cfg.easing === 'smooth') t = ease(t);
  else if (cfg.easing === 'steps') t = Math.round(t * (N - 1)) / (N - 1);

function gifPaletteFromHistogram(hist) {
  let entries = [];
  for (let key = 0; key < hist.length; key++) if (hist[key]) {
    entries.push({ r: (((key >> 10) & 31) << 3) + 4, g: (((key >> 5) & 31) << 3) + 4, b: ((key & 31) << 3) + 4, n: hist[key] });
  }
  if (!entries.length) entries = [{r:255,g:255,b:255,n:1}];
  const boxStats = items => {
    let r0=255,r1=0,g0=255,g1=0,b0=255,b1=0,total=0;
    for (const c of items) { r0=Math.min(r0,c.r);r1=Math.max(r1,c.r);g0=Math.min(g0,c.g);g1=Math.max(g1,c.g);b0=Math.min(b0,c.b);b1=Math.max(b1,c.b);total+=c.n; }
    const ranges=[r1-r0,g1-g0,b1-b0];
    return {ranges,total,channel:ranges.indexOf(Math.max(...ranges)),range:Math.max(...ranges)};
  };
  const boxes = [entries];
  while (boxes.length < 255) {
    let best=-1, bestScore=-1, chosen=null;
    for (let i=0;i<boxes.length;i++) {
      if (boxes[i].length < 2) continue;
      const st=boxStats(boxes[i]), score=st.range*Math.sqrt(st.total);
      if (score>bestScore) { best=i;bestScore=score;chosen=st; }
    }
    if (best<0 || !chosen || chosen.range===0) break;
    const items=boxes[best], ch=['r','g','b'][chosen.channel];

async function makeGif(options, cfg) {

$('exGif').onclick = async () => {
